name: crowdfunding-dapp

services:
  chain:
    image: ghcr.io/foundry-rs/foundry:v1.9.0
    command:
      - anvil
      - --host
      - 0.0.0.0
      - --port
      - "8545"
      - --chain-id
      - "31337"
      - --accounts
      - "10"
      - --balance
      - "10000"
      - --block-time
      - "1"
      - --state
      - /chain-data/anvil-state.json
      - --state-interval
      - "10"
    ports:
      - "127.0.0.1:${RPC_PORT:-8545}:8545"
    volumes:
      - anvil-data:/chain-data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "cast chain-id --rpc-url http://127.0.0.1:8545 | grep -qx 31337"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 3s
    networks: [local-chain]

  deployer:
    build:
      context: .
      dockerfile: docker/deployer.Dockerfile
    image: crowdfunding-deployer:1.0.0
    user: "0:0"
    environment:
      RPC_URL: http://chain:8545
      BROWSER_RPC_URL: http://localhost:${RPC_PORT:-8545}
      ANVIL_ACCOUNT_0: "0xf39Fd6e51aad88F6F4ce6aB8827279cffFb92266"
      ANVIL_ACCOUNT_1: "0x70997970C51812dc3A010C7d01b50e0d17dc79C8"
      ANVIL_ACCOUNT_2: "0x3C44CdDdB6a900fa2b585dd299e03d12FA4293BC"
    volumes:
      - contract-runtime:/runtime
    depends_on:
      chain:
        condition: service_healthy
    restart: "no"
    networks: [local-chain]

  foundry-tools:
    image: ghcr.io/foundry-rs/foundry:v1.9.0
    working_dir: /workspace/contracts
    entrypoint: ["sh", "-c"]
    command: ["while true; do sleep 3600; done"]
    volumes:
      - ./contracts:/workspace/contracts
    depends_on:
      chain:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "cast", "--version"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks: [local-chain]

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: crowdfunding-web:1.0.0
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:80"
    volumes:
      - contract-runtime:/usr/share/nginx/html/runtime
    depends_on:
      deployer:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/healthz | grep -q ok"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks: [local-chain]

volumes:
  anvil-data:
  contract-runtime:

networks:
  local-chain:
    driver: bridge
